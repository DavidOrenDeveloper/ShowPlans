# שולח פעם ביום שאילתה קטנה ל-Supabase כדי שהפרויקט החינמי לא יושהה בגלל חוסר פעילות.
# דורש שני Secrets במאגר (Repository secrets): SUPABASE_URL ו-SUPABASE_PUBLISHABLE_KEY
name: supabase-keepalive
on:
  schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RAW_URL: ${{ secrets.SUPABASE_URL }}
      RAW_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - run: |
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]"' | sed 's#/*$##; s#/rest/v1$##')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]"')
          echo "אורך כתובת: ${#URL} | אורך מפתח: ${#KEY} | מתחיל ב-https: $([[ $URL == https://* ]] && echo כן || echo לא)"
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
