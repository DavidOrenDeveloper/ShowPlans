name: deploy-supabase-functions
# פורס את הפונקציות ל-Supabase מתוך GitHub (בלי להתקין כלום במחשב). מפעילים ידנית: Actions ← deploy-supabase-functions ← Run workflow
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy drive-download drive-upload-session admin-users drive-admin --project-ref yokgltxcmnfgwygvecnc --no-verify-jwt
